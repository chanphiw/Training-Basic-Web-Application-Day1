<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- navbar -->
  <div class="navbar bg-base-100 shadow-sm">
    <div class="flex-1">
      <a class="btn btn-ghost text-xl" href="index.html">PREM Digital</a>
    </div>
    <div class="flex gap-2">
      <input type="text" placeholder="Search" class="input input-bordered w-24 md:w-auto" />
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
          <div class="w-10 rounded-full">
            <img alt="Tailwind CSS Navbar component"
              src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.webp" />
          </div>
        </div>


        <ul tabindex="-1" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
          <li>
            <a class="justify-between">
              Profile
              <span class="badge">New</span>
            </a>
          </li>
          <li><a>Settings</a></li>
          <li><a>Logout</a></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Form -->


  <!-- fieldset -->
  <div class="container mx-auto my-10 text-center">
    <h1 class="text-2xl text-blue-500">แบบฟอร์มสำหรับการลงทะเบียน</h1>

    <!-- Form login -->
    <div class="container mx-auto my-10 flex justify-center">
      <form class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
        <!-- name -->
        <fieldset class="fieldset">
          <label class="label">Name</label>
          <input type="text" class="input validator" placeholder="Name" required />
          <p class="validator-hint hidden">Required</p>
        </fieldset>

        <fieldset class="fieldset">
          <label class="label">Email</label>
          <input type="email" class="input validator" placeholder="Email" required />
          <p class="validator-hint hidden">Required</p>
        </fieldset>

        <label class="fieldset">
          <span class="label">Password</span>
          <input type="password" class="input validator" placeholder="Password" required />
          <span class="validator-hint hidden">Required</span>
        </label>

        <a class="btn btn-success mt-4" type="submit" href="index.html">Register</a>
        <button class="btn btn-ghost mt-1" type="reset">Reset</button>
      </form>

    </div>



    <!-- Footer -->
    <footer class="mx-auto justify-between footer sm:footer-horizontal bg-neutral text-neutral-content p-10">
      <nav>
        <h6 class="footer-title">Services</h6>
        <a class="link link-hover">Branding</a>
        <a class="link link-hover">Design</a>
        <a class="link link-hover">Marketing</a>
        <a class="link link-hover">Advertisement</a>
      </nav>
      <nav>
        <h6 class="footer-title">Company</h6>
        <a class="link link-hover">About us</a>
        <a class="link link-hover">Contact</a>
        <a class="link link-hover">Jobs</a>
        <a class="link link-hover">Press kit</a>
      </nav>
      <nav>
        <h6 class="footer-title">Legal</h6>
        <a class="link link-hover">Terms of use</a>
        <a class="link link-hover">Privacy policy</a>
        <a class="link link-hover">Cookie policy</a>
      </nav>
      <nav>
        <h6 class="footer-title">Social</h6>
        <a class="link link-hover">Instagram</a>
        <a class="link link-hover">Facebook</a>
        <a class="link link-hover">Twitter</a>
      </nav>
    </footer>




    <script src="app.js"></script>
</body>

</html>
